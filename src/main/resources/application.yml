spring:
  application:
    name: wallet-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:wallet_app}
    password: ${WALLET_APP_PASSWORD}
    hikari:
      pool-name: wallet-app-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = WALLET_OWNER

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

wallet:
  security:
    api-key: ${API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
